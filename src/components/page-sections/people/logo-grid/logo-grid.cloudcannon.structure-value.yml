        _inputs:
          name:
            type: text
            comment: Name of the sponsor or supplier (used for alt text and accessibility).
          logoSource:
            type: image
            comment: The logo image.
            options:
              paths:
                uploads: src/assets/images
                static: ""
          logoAlt:
            type: text
            comment: Alt text describing the logo (defaults to the name if left blank).
          link:
            type: text
            comment: 'Optional URL to link to (e.g. https://example.com). Leave blank for no link.'
